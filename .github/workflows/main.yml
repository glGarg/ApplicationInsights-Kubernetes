name: Add comment
on:
  issues:
    types:
      - labeled
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
jobs:
  run-initial-benchmark:
    if: github.event.label.name == 'perf'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.0.x' # Ensure this matches the TargetFramework in your .csproj file

      - name: Restore dependencies
        run: dotnet restore
      - name: Run Benchmarks
        run: dotnet run -c Release --project tests/Benchmarks/Benchmarks.csproj
      - name: Upload baseline benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: baseline-results
          path: artifacts/results/

  run-perf-fix-benchmark:
    if: github.event.label.name == 'perf'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: 'dev/jabovee/scrubdata-fix'

      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.0.x' # Ensure this matches the TargetFramework in your .csproj file

      - name: Restore dependencies
        run: dotnet restore
      - name: Run Benchmarks
        run: dotnet run -c Release --project tests/Benchmarks/Benchmarks.csproj
      - name: Upload baseline benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: postfix-results
          path: artifacts/results/

  compare-benchmarks:
    runs-on: ubuntu-latest
    needs: 
      - run-initial-benchmark
      - run-perf-fix-benchmark
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'
          
      - name: Install zlib
        run: npm install zlib

      - name: Compare Benchmark Results
        run: node .github/scripts/compare-benchmarks.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASELINE_ARTIFACT: baseline-results
          FIX_ARTIFACT: fix-results
          FIXED_BRANCH: dev/jabovee/scrubdata-fix
